[package]
name = "zohara-updates-system"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
askama = "0.12"
askama_axum = "0.4"
axum = { version = "0.7", features = ["macros", "query", "form"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
hmac = "0.12"
jsonwebtoken = "9"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
